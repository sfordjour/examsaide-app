name: Generate Android App Icons

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow

      - name: Download logo and generate icons
        run: |
          python3 - << 'PYEOF'
          import urllib.request, base64, os
          from PIL import Image, ImageDraw
          from io import BytesIO

          # Download logo from live site
          url = "https://learn.examsaide.com/theme/image.php/boost/local_examsaide/1789843889/logo"
          with urllib.request.urlopen(url) as r:
              img = Image.open(BytesIO(r.read())).convert("RGBA")

          print(f"Logo size: {img.size}")
          w, h = img.size
          crop = min(w, h)
          x0, y0 = (w - crop) // 2, (h - crop) // 2
          img_sq = img.crop((x0, y0, x0 + crop, y0 + crop))

          def make_icon(base, size, circle=False):
              pad = int(size * 0.1)
              inner = size - 2 * pad
              r = base.resize((inner, inner), Image.LANCZOS)
              c = Image.new("RGBA", (size, size), (255, 255, 255, 255))
              c.paste(r, (pad, pad), r)
              if circle:
                  mask = Image.new("L", (size, size), 0)
                  ImageDraw.Draw(mask).ellipse((0, 0, size, size), fill=255)
                  c.putalpha(mask)
              return c

          for density, size in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
              d = f"app/src/main/res/mipmap-{density}"
              os.makedirs(d, exist_ok=True)
              make_icon(img_sq, size).save(f"{d}/ic_launcher.png")
              make_icon(img_sq, size, circle=True).save(f"{d}/ic_launcher_round.png")
              print(f"{density}: {size}x{size} done")
          PYEOF

      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/mipmap-*/ic_launcher.png app/src/main/res/mipmap-*/ic_launcher_round.png
          git diff --cached --quiet || git commit -m "Add ExamsAide branded launcher icons"
          git push
